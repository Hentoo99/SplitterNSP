name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   label: macOS Apple Silicon }
          - { os: macos-15-intel, label: macOS Intel }
          - { os: windows-latest, label: Windows }
          - { os: ubuntu-22.04,   label: Linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Smoke test
        run: python -m splitter_nsp info SplitterNSP.py
      - name: Build
        run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: SplitterNSP-${{ matrix.os }}
          path: dist/SplitterNSP-*
          if-no-files-found: error

  release:
    needs: build
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
